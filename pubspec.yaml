name: fp_30x_midi_controller_v2
description: "A piano training game for the Roland FP-30X, over Bluetooth MIDI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hooks_riverpod: ^3.3.2
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: '>=4.0.0 <5.0.0'
  go_router: ^17.4.0
  flutter_midi_command: ^1.0.9
  flutter_midi_command_ble: ^1.0.9
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/songs/

  fonts:
    # Display face — the app's stylized UI type.
    - family: JollyLodger
      fonts:
        - asset: assets/fonts/JollyLodger-Regular.ttf
    # SMuFL music notation glyphs (clefs, noteheads, accidentals).
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
